name: Deploy to Vercel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'public/**'
      - 'content/**'
      - 'scripts/generate-sitemap.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'next.config.ts'
      - 'vercel.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm run build

      # Caché del global dir de pnpm para Vercel CLI (evita re-descarga ~30-60s).
      - name: Restore Vercel CLI cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/global
          key: ${{ runner.os }}-vercel-cli-latest
          restore-keys: |
            ${{ runner.os }}-vercel-cli-

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Link Vercel project
        run: vercel link --project=portfolio-dev --scope=thebellepoques-projects --yes --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
